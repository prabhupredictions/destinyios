name: iOS CI

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

jobs:
  test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Show Xcode Version
        run: xcodebuild -version

      # Resolve a concrete simulator UDID at runtime. Pinning the device by
      # name (iPhone 17 Pro) breaks whenever the runner image / selected Xcode
      # has no pre-created device of that exact name — the previous CI failure.
      # Prefer iPhone 17 Pro (repo standard), fall back to any available iPhone.
      - name: Select iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep 'iPhone 17 Pro (' | grep -oE '[0-9A-Fa-f-]{36}' | head -n1)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-Fa-f-]{36}')
          fi
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator on this runner:"; xcrun simctl list devices; exit 1
          fi
          echo "Selected simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build \
            -scheme ios_app \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Tests
        run: |
          xcodebuild test \
            -scheme ios_app \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
